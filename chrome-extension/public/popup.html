<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QALens</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header>
      <div class="header-left">
        <img src="icons/icon32.png" alt="" class="logo" />
        <span class="title">QALens</span>
      </div>
      <span id="status-dot" class="idle">● Idle</span>
    </header>

    <!-- Current page -->
    <div id="page-bar">
      <span class="page-label">Page</span>
      <span id="page-host" class="page-host">—</span>
    </div>

    <!-- Mode tabs -->
    <div id="mode-tabs">
      <button class="mode-tab active" data-mode="api">📡 API Calls</button>
      <button class="mode-tab" data-mode="locators">🔍 Page Locators</button>
    </div>

    <!-- ── API Calls view ────────────────────────────────────────────────── -->
    <div id="api-view">

      <!-- Toolbar: endpoint count + controls -->
      <div id="api-toolbar">
        <span id="endpoint-count">0 endpoints</span>
        <div class="toolbar-actions">
          <button id="toggle-capture" class="ctrl-btn">⏸ Pause</button>
          <button id="clear-all"      class="ctrl-btn">✕ Clear</button>
        </div>
      </div>

      <!-- Endpoint list (shrinks when detail panel is open) -->
      <div id="endpoint-list">
        <div id="no-data">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 19l-7-7 7-7M15 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p>No API calls captured yet.</p>
          <p class="hint">Browse any page — calls appear here automatically.</p>
        </div>
      </div>

      <!-- Detail panel (hidden until a row is clicked) -->
      <div id="detail-panel" class="hidden">
        <div id="detail-header">
          <span id="detail-method" class="method">GET</span>
          <span id="detail-url" class="detail-url"></span>
          <button id="close-detail" title="Close">✕</button>
        </div>

        <!-- Endpoint details: query params + request headers -->
        <div id="detail-body">
          <div class="detail-section-title">Query Params</div>
          <table id="detail-params" class="detail-table"></table>
          <div class="detail-section-title">Request Headers</div>
          <table id="detail-headers" class="detail-table"></table>
        </div>
      </div>

    </div><!-- /#api-view -->

    <!-- ── Page Locators view ─────────────────────────────────────────────── -->
    <div id="locators-view" class="hidden">

      <!-- Toolbar: scan button | type filters | framework selector -->
      <div id="locator-toolbar">
        <button id="scan-btn">⬡ Scan Page</button>
        <div id="loc-filters">
          <button class="lf-btn active" data-filter="all">All</button>
          <button class="lf-btn" data-filter="button">Btns</button>
          <button class="lf-btn" data-filter="input">Inputs</button>
          <button class="lf-btn" data-filter="link">Links</button>
        </div>
        <select id="fw-select">
          <option value="both">PW + SE</option>
          <option value="playwright">Playwright</option>
          <option value="selenium">Selenium</option>
        </select>
      </div>

      <!-- Result count line -->
      <div id="loc-status" class="hidden"></div>

      <!-- Locator item list -->
      <div id="loc-list">
        <div id="loc-empty">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35" stroke-linecap="round"/>
          </svg>
          <p>Click <strong>Scan Page</strong> to discover all testable elements on the current page.</p>
        </div>
      </div>

    </div><!-- /#locators-view -->

    <!-- Bottom action bar -->
    <div id="actions">
      <button id="export-csv">⎘ Copy CSV</button>
      <button id="export-json" class="primary">⎘ Copy JSON</button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
